# The CECL website (site/): build, check and test it on every change to it.
# Nothing here deploys, and no secrets are used: the site is built from the aggregate data files in
# site/public/data (written by site/scripts/export_site_data.py on the PC; aggregates only).
#
# Steps: toolchain check -> install -> pinned design copy unchanged -> data files match their schemas ->
# build -> Playwright at 1440 and 375 px (console errors, outside requests, sideways scroll, cookies, axe,
# the page features, no identifiers or loan ids in any data file) -> Lighthouse budget -> screenshots kept.
name: Site

on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same image as Bank Health's site and the portfolio: Node 26.13.0, npm 11.20.0, Chromium, pinned to
    # the Playwright version. The toolchain step fails if it drifts from site/.nvmrc and packageManager.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain matches the pinned Node and npm
        run: |
          want_node="v$(cat .nvmrc)"; want_npm="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
          echo "node $(node -v) (want $want_node), npm $(npm -v) (want $want_npm)"
          test "$(node -v)" = "$want_node" && test "$(npm -v)" = "$want_npm"

      - name: Install exactly the lockfile
        run: npm ci

      - name: Pinned design copy matches its release (martinogie/portfolio-site)
        run: node src/design/check-design.mjs

      - name: Data files match their schemas
        run: node scripts/validate-data.mjs

      - name: Build
        run: npx astro build

      - name: Playwright and axe (1440 and 375 px)
        run: |
          mkdir -p ../docs/images/site
          npx playwright test

      - name: Lighthouse budget
        run: sh scripts/lighthouse.sh

      - name: Keep screenshots and the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-screenshots
          path: |
            docs/images/site/
            site/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
