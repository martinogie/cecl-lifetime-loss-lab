# Deploy the CECL website (site/) to the Cloudflare Pages project "cecl". ONLY runs when Martins clicks
# "Run workflow" (Actions -> Deploy site): starting it by hand is the approval, as for portfolio-site and
# Bank Health. Secrets (repository): CLOUDFLARE_API_TOKEN (an account token with Cloudflare Pages: Edit
# only) and CLOUDFLARE_ACCOUNT_ID, both created and added by Martins, never printed.
#
# The finance router (portfolio-site) sends finance.martinsogiekpolor.com/cecl/* to this Pages project;
# its address must match CECL_ORIGIN in portfolio-site's wrangler.finance.toml (the summary below shows it).
name: Deploy site

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  WRANGLER: "wrangler@4.151.3"   # pinned, the same version as the portfolio and Bank Health deploys
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  site:
    # only from main: what is published is what was reviewed and merged
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CI: "1"
      HOME: /root
      PROJECT: cecl
    steps:
      - uses: actions/checkout@v7
      - name: Install, check, build and test (the same checks as the Site workflow)
        run: |
          test "$(node -v)" = "v$(cat .nvmrc)"
          npm ci
          node src/design/check-design.mjs
          node scripts/validate-data.mjs
          npx astro build
          mkdir -p ../docs/images/site
          npx playwright test
      - name: Create the Pages project the first time
        run: |
          if npx --yes "$WRANGLER" pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists"
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes "$WRANGLER" pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Record the project's address (must match CECL_ORIGIN in the finance router)
        run: |
          echo "### Deployed ${PROJECT}" >> "$GITHUB_STEP_SUMMARY"
          npx --yes "$WRANGLER" pages project list 2>/dev/null | grep -w "$PROJECT" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
