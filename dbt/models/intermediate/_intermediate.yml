version: 2

models:
  - name: int_freddie__loan_months
    description: >
      Monthly records with the origination details the panel needs. remaining_months is Freddie's
      value, or (when Freddie left it empty, L-013) months from the reporting month to maturity;
      remaining_months_derived marks those rows.
    columns:
      - name: loan_id
        data_tests: [not_null]
      - name: remaining_months
        data_tests: [not_null]
      - name: term_over_360
        data_tests: [not_null]
