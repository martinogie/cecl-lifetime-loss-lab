              - lightgbm==4.7.0
              - interpret-core==0.7.8
              - scikit-learn==1.9.1
      parameters:
        - name: env
          default: ${var.env}
        - name: layout
          default: ${var.layout}
        - name: family
          default: logistic
        - name: include_covid
          default: "false"
        - name: ebm_sample_every
          default: "1"
        - name: tune
          default: "true"
        - name: settings
          default: ""
        - name: era
          default: none
        - name: learning_curve
          default: "false"
        - name: curve_fractions
          default: "0.1;0.25;0.5;1.0"
        - name: ebm_curve_outer_bags
          default: "1"
        - name: code_version
          default: unknown
        - name: data_snapshot
          default: cecl-2026Q2-data-v1
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ./notebooks/50_train_family.py
          environment_key: ml
          timeout_seconds: 7200
          max_retries: 0

    oot_test:
      name: cecl_lab_oot_test_${var.env}
      description: "The out-of-time test, once (ADR-009 E; multi-state, Amendments 1 E and 2): started only by scripts/run_oot_test.py"
      timeout_seconds: 0  # no limit (Martins, 19 Nov 2026); never started where it could run into 02:30 Central
      max_concurrent_runs: 1
      queue:
