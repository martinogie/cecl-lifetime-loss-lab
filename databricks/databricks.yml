        - name: years
          default: "2005,2009,2019"
        - name: export_slice
          default: "true"
      tasks:
        - task_key: load_macro
          notebook_task:
            notebook_path: ./notebooks/35_load_macro.py
          environment_key: pinned
          timeout_seconds: 1800
          max_retries: 0
        - task_key: features
          depends_on: [{task_key: load_macro}]
          notebook_task:
            notebook_path: ./notebooks/40_features.py
          environment_key: pinned
          timeout_seconds: 7200
          max_retries: 0

    train_family:
      name: cecl_lab_train_family_${var.env}
      description: "Train ONE model family on the training months and validate it on 2017-2019 (cecl.models.pipeline); one family per run so a stopped run only redoes that family"
      timeout_seconds: 7200
      max_concurrent_runs: 1
      queue:
