targets:
  dev:
    # Not "mode: development": that mode prefixes every name with dev_<user>_ (schemas, volume,
    # model), which breaks the fixed names the code uses (cecl_lab_dev.bronze, ...) and puts a
    # username into table names. The environment is already in every name (catalog cecl_lab_dev,
    # job names ..._dev), and the jobs have no schedules to pause. (Found 16 Nov 2026, step 9.)
    default: true
    variables:
      env: dev
      catalog: cecl_lab_dev
      experiment_name: cecl-lifetime-loss-lab-dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      env: prod
      catalog: cecl_lab
      experiment_name: cecl-lifetime-loss-lab
