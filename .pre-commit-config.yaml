# Checks that run on `git commit` (install once: pip install pre-commit && pre-commit install).
# CI runs the same ruff, gitleaks and hygiene checks, so a skipped hook is still caught on GitHub.
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3   # same version as requirements-lint.txt
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Blocks any file over 1 MB: real data never belongs in git, and fixtures stay tiny.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
        exclude: ^docs/.*\.pdf$
      - id: trailing-whitespace
        exclude: ^docs/.*\.pdf$
      - id: check-yaml
        # Syntax-only: Docker Compose uses its own tags (e.g. !override in docker-compose.dev.yaml),
        # which a plain YAML loader rejects. Broken YAML is still caught.
        args: ["--unsafe"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2   # same version as the CI secrets job
    hooks:
      - id: gitleaks-docker   # runs the gitleaks image (needs Docker); no Go toolchain to install
  - repo: local
    hooks:
      # No emails, workspace hosts, IPs or OCIDs in any file (CLAUDE.md hard rule 2).
      - id: repo-hygiene
        name: repo hygiene (no account identifiers, .gitignore rules)
        entry: python -m pytest -q -p no:cacheprovider ingestion/tests/test_repo_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
